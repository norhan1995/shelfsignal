name: Verify ShelfSignal

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source and deploy artifact match
        run: cmp src/index.html dist/index.html

      - name: Verify required project files
        run: |
          test -s README.md
          test -s src/index.html
          test -s dist/index.html
          test -d docs
          test -d data
